http:
  routers:
    gateway-local:
      rule: "Host(`api.dogappa.local`)"
      entryPoints:
        - web
      middlewares:
        - gateway-redirect
      service: gateway-local-service
    gateway-local-secure:
      rule: "Host(`api.dogappa.local`)"
      entryPoints:
        - websecure
      tls: {}
      service: gateway-local-service
  middlewares:
    gateway-redirect:
      redirectScheme:
        scheme: https
        permanent: true
  services:
    gateway-local-service:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5000"
        passHostHeader: true
