services:
  gateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Stage
    deploy:
      labels:
        - "traefik.enable=true"
        # HTTP роутер (редирект на HTTPS)
        - "traefik.http.routers.gateway.rule=Host(`api.dogappa.com`)"
        - "traefik.http.routers.gateway.entrypoints=web"
        - "traefik.http.routers.gateway.middlewares=gateway-redirect"
        - "traefik.http.middlewares.gateway-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.gateway-redirect.redirectscheme.permanent=true"
        # HTTPS роутер (HTTP/3 включён на entrypoint websecure в Traefik)
        - "traefik.http.routers.gateway-secure.rule=Host(`api.dogappa.com`)"
        - "traefik.http.routers.gateway-secure.entrypoints=websecure"
        - "traefik.http.routers.gateway-secure.tls=true"
        - "traefik.http.routers.gateway-secure.tls.certresolver=letsencrypt"
        - "traefik.http.services.gateway.loadbalancer.server.port=8080"

  users:
    environment:
      - DOTNET_ENVIRONMENT=Stage

  identity:
    environment:
      - DOTNET_ENVIRONMENT=Stage
  identity-webapi:
    environment:
      - DOTNET_ENVIRONMENT=Stage
    deploy:
      labels:
        - "traefik.enable=true"
        # HTTP роутер (редирект на HTTPS)
        - "traefik.http.routers.identity-webapi.rule=Host(`identity.dogappa.com`)"
        - "traefik.http.routers.identity-webapi.entrypoints=web"
        - "traefik.http.routers.identity-webapi.middlewares=identity-webapi-redirect"
        - "traefik.http.middlewares.identity-webapi-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.identity-webapi-redirect.redirectscheme.permanent=true"
        # HTTPS роутер
        - "traefik.http.routers.identity-webapi-secure.rule=Host(`identity.dogappa.com`)"
        - "traefik.http.routers.identity-webapi-secure.entrypoints=websecure"
        - "traefik.http.routers.identity-webapi-secure.tls=true"
        - "traefik.http.services.identity-webapi.loadbalancer.server.port=8080"

  frontend:
    deploy:
      labels:
        - "traefik.enable=true"
        # HTTP роутер (редирект на HTTPS)
        - "traefik.http.routers.frontend.rule=Host(`app.dogappa.com`)"
        - "traefik.http.routers.frontend.entrypoints=web"
        - "traefik.http.routers.frontend.middlewares=frontend-redirect"
        - "traefik.http.middlewares.frontend-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.frontend-redirect.redirectscheme.permanent=true"
        # Basic Auth
        - "traefik.http.middlewares.frontend-basicauth.basicauth.users=admin:$$apr1$$r3HRM6zR$$Z9kmGOOieQ5Cv9DmlJIVf0"
        # HTTPS роутер с Basic Auth
        - "traefik.http.routers.frontend-secure.rule=Host(`app.dogappa.com`)"
        - "traefik.http.routers.frontend-secure.entrypoints=websecure"
        - "traefik.http.routers.frontend-secure.tls=true"
        - "traefik.http.routers.frontend-secure.tls.certresolver=letsencrypt"
        - "traefik.http.routers.frontend-secure.middlewares=frontend-basicauth"
        - "traefik.http.services.frontend.loadbalancer.server.port=80"

  landing:
    deploy:
      labels:
        - "traefik.enable=true"
        # HTTP router for ACME challenge (no redirect)
        - "traefik.http.routers.landing-acme.rule=Host(`dogappa.com`) && PathPrefix(`/.well-known/acme-challenge/`)"
        - "traefik.http.routers.landing-acme.entrypoints=web"
        - "traefik.http.routers.landing-acme.priority=100"
        # HTTP router (redirect to HTTPS)
        - "traefik.http.routers.landing-http.rule=Host(`dogappa.com`)"
        - "traefik.http.routers.landing-http.entrypoints=web"
        - "traefik.http.routers.landing-http.middlewares=landing-redirect"
        - "traefik.http.routers.landing-http.priority=1"
        # HTTPS router with automatic SSL certificate and HTTP/3
        - "traefik.http.routers.landing.rule=Host(`dogappa.com`)"
        - "traefik.http.routers.landing.entrypoints=websecure"
        - "traefik.http.routers.landing.tls=true"
        - "traefik.http.routers.landing.tls.certresolver=letsencrypt"
        # Redirect middleware
        - "traefik.http.middlewares.landing-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.landing-redirect.redirectscheme.permanent=true"
        # Service
        - "traefik.http.services.landing.loadbalancer.server.port=80"
    networks:
      - infra_traefik

  telegram-bot:
    image: ghcr.io/mohctpuk/dog-telegram-bot:latest
    networks:
      - infra_traefik
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 60s
