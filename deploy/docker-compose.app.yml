services:
  # Gateway сервис в Docker
  # Для переключения между Docker и локальным режимом используйте скрипт:
  #   ./switch-gateway-mode.sh docker  - Gateway в Docker (по умолчанию)
  #   ./switch-gateway-mode.sh local   - Gateway локально на host.docker.internal:5000
  # См. GATEWAY-SWITCH-MODE.md для подробностей
  gateway:
    image: ghcr.io/mohctpuk/dog-gateway:latest
    networks:
      - infra_traefik
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    deploy:
      labels:
        - "traefik.enable=true"
        # HTTP роутер (редирект на HTTPS)
        - "traefik.http.routers.gateway.rule=Host(`api.dogappa.local`)"
        - "traefik.http.routers.gateway.entrypoints=web"
        - "traefik.http.routers.gateway.middlewares=gateway-redirect"
        - "traefik.http.middlewares.gateway-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.gateway-redirect.redirectscheme.permanent=true"
        # HTTPS роутер
        - "traefik.http.routers.gateway-secure.rule=Host(`api.dogappa.local`)"
        - "traefik.http.routers.gateway-secure.entrypoints=websecure"
        - "traefik.http.routers.gateway-secure.tls=true"
        - "traefik.http.services.gateway.loadbalancer.server.port=8080"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 60s
          
  users:
    image: ghcr.io/mohctpuk/dog-users:latest
    networks:
      - infra_traefik
    environment:
      - DOTNET_ENVIRONMENT=Development
    deploy:
      restart_policy:
          condition: on-failure
          delay: 5s
          max_attempts: 10
          window: 60s

  dogs:
    image: ghcr.io/mohctpuk/dog-dog:latest
    networks:
      - infra_traefik
    environment:
      - DOTNET_ENVIRONMENT=Development
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 60s

  owners:
    image: ghcr.io/mohctpuk/dog-owner:latest
    networks:
      - infra_traefik
    environment:
      - DOTNET_ENVIRONMENT=Development
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 60s

  identity:
    image: ghcr.io/mohctpuk/dog-identity:latest
    networks:
      - infra_traefik
    environment:
      - DOTNET_ENVIRONMENT=Development
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 60s

  identity-webapi:
    image: ghcr.io/mohctpuk/dog-identity-webapi:latest
    networks:
      - infra_traefik
    environment:
      - DOTNET_ENVIRONMENT=Development
    deploy:
      labels:
        - "traefik.enable=true"
        # HTTP роутер (редирект на HTTPS)
        - "traefik.http.routers.identity-webapi.rule=Host(`identity.dogappa.local`)"
        - "traefik.http.routers.identity-webapi.entrypoints=web"
        - "traefik.http.routers.identity-webapi.middlewares=identity-webapi-redirect"
        - "traefik.http.middlewares.identity-webapi-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.identity-webapi-redirect.redirectscheme.permanent=true"
        # HTTPS роутер
        - "traefik.http.routers.identity-webapi-secure.rule=Host(`identity.dogappa.local`)"
        - "traefik.http.routers.identity-webapi-secure.entrypoints=websecure"
        - "traefik.http.routers.identity-webapi-secure.tls=true"
        - "traefik.http.services.identity-webapi.loadbalancer.server.port=8080"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 60s

  landing:
    image: ghcr.io/mohctpuk/dog-landing:latest
    deploy:
      labels:
        - "traefik.enable=true"
        # HTTP роутер (редирект на HTTPS)
        - "traefik.http.routers.landing.rule=Host(`dogappa.local`)"
        - "traefik.http.routers.landing.entrypoints=web"
        - "traefik.http.routers.landing.middlewares=landing-redirect"
        - "traefik.http.middlewares.landing-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.landing-redirect.redirectscheme.permanent=true"
        # HTTPS роутер
        - "traefik.http.routers.landing-secure.rule=Host(`dogappa.local`)"
        - "traefik.http.routers.landing-secure.entrypoints=websecure"
        - "traefik.http.routers.landing-secure.tls=true"
        - "traefik.http.services.landing.loadbalancer.server.port=80"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 60s
    networks:
      - infra_traefik

  frontend:
    image: ghcr.io/mohctpuk/dog-frontend:latest
    networks:
      - infra_traefik
    deploy:
      labels:
        - "traefik.enable=true"
        # HTTP роутер (редирект на HTTPS)
        - "traefik.http.routers.frontend.rule=Host(`app.dogappa.local`)"
        - "traefik.http.routers.frontend.entrypoints=web"
        - "traefik.http.routers.frontend.middlewares=frontend-redirect"
        - "traefik.http.middlewares.frontend-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.frontend-redirect.redirectscheme.permanent=true"
        # HTTPS роутер
        - "traefik.http.routers.frontend-secure.rule=Host(`app.dogappa.local`)"
        - "traefik.http.routers.frontend-secure.entrypoints=websecure"
        - "traefik.http.routers.frontend-secure.tls=true"
        - "traefik.http.services.frontend.loadbalancer.server.port=80"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 60s

networks:
  infra_traefik:
    name: infra_traefik
    external: true
