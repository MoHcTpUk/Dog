services:
  portainer:
    image: portainer/portainer-ce
    ports:
      - target: 9000
        published: 9003
        protocol: tcp
        mode: host
      - target: 8000
        published: 8001
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 60s
    networks:
      - portainer-net

volumes:
  portainer_data:

networks:
  portainer-net:
    driver: overlay