services:
  traefik:
    ports:
      - target: 80
        published: 8181
        protocol: tcp
        mode: host
      - target: 443
        published: 8443
        protocol: tcp
        mode: host
      - target: 443
        published: 8443
        protocol: udp
        mode: host
      - target: 8080
        published: 9002
        protocol: tcp
        mode: host

  postgres:
    ports:
      - target: 5432
        published: 6566
        protocol: tcp
        mode: host