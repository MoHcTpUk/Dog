services:
  traefik:
    image: traefik:v3.6.2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      placement:
        constraints:
          - node.role == manager
    networks:
      - traefik

networks:
  traefik:
    name: infra_traefik
    driver: overlay
    attachable: true
