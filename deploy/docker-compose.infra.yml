services:
  traefik:
    image: traefik:v3.6.2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/certs:ro
    command:
      - "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--entryPoints.traefik.address=:8080"
      - "--providers.swarm=true"
      - "--providers.swarm.exposedbydefault=false"
      - "--providers.swarm.network=infra_traefik"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      - "--providers.file.directory=/certs"
      - "--providers.file.watch=true"
    ports:
      - target: 80
        published: 8000
        protocol: tcp
        mode: host
      - target: 443
        published: 8443
        protocol: tcp
        mode: host
      - target: 8080
        published: 9002
        protocol: tcp
        mode: host
    deploy:
      placement:
        constraints:
          - node.role == manager
    networks:
      - traefik

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./authentik/init-authentik.sql:/docker-entrypoint-initdb.d/01-init-authentik.sql
    ports:
      - target: 5432
        published: 4321
        mode: host
    networks:
      - traefik
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    command: --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - traefik
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  authentik-server:
    image: ghcr.io/goauthentik/server:latest
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-PleaseChangeThisToASecureRandomString123456}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: user
      AUTHENTIK_POSTGRESQL__PASSWORD: password
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-admin}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@dogappa.com}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-72wy8CDoThVNCFJn9mqVBkX4xnag3P5jBbvbNXUKGW58VPdE5M8yUOYWibQb}
      # Cookie configuration for cross-domain support
      # Set cookie domain to .dogappa.local so cookies work across all subdomains
      # Format: AUTHENTIK_<SECTION>__<KEY> (double underscore for nested config)
      AUTHENTIK_COOKIE_DOMAIN: .dogappa.local
      # Custom blueprints are mounted to /blueprints/custom (default Authentik scan path)
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
      - ./authentik/blueprints/local:/blueprints/custom
    ports:
      - "9000:9000"
      - "9443:9443"
    depends_on:
      - postgres
      - redis
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    deploy:
      labels:
        - "traefik.enable=true"
        # HTTP роутер (редирект на HTTPS)
        - "traefik.http.routers.authentik.rule=Host(`auth.dogappa.local`)"
        - "traefik.http.routers.authentik.entrypoints=web"
        - "traefik.http.routers.authentik.middlewares=authentik-redirect"
        - "traefik.http.middlewares.authentik-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.authentik-redirect.redirectscheme.permanent=true"
        # HTTPS роутер
        - "traefik.http.routers.authentik-secure.rule=Host(`auth.dogappa.local`)"
        - "traefik.http.routers.authentik-secure.entrypoints=websecure"
        - "traefik.http.routers.authentik-secure.tls=true"
        - "traefik.http.services.authentik.loadbalancer.server.port=9000"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 60s

  authentik-worker:
    image: ghcr.io/goauthentik/server:latest
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-PleaseChangeThisToASecureRandomString123456}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: user
      AUTHENTIK_POSTGRESQL__PASSWORD: password
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-admin}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@dogappa.com}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-72wy8CDoThVNCFJn9mqVBkX4xnag3P5jBbvbNXUKGW58VPdE5M8yUOYWibQb}
      # Cookie configuration for cross-domain support (must match server settings)
      # Format: AUTHENTIK_<SECTION>__<KEY> (double underscore for nested config)
      AUTHENTIK_COOKIE_DOMAIN: .dogappa.local
      # Custom blueprints are mounted to /blueprints/custom (default Authentik scan path)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - authentik_media:/media
      - authentik_templates:/templates
      - authentik_certs:/certs
      - ./authentik/blueprints/local:/blueprints/custom
    depends_on:
      - postgres
      - redis
    networks:
      - traefik
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 60s

  nats:
    image: nats:latest
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
    networks:
      - traefik

  minio:
    image: minio/minio:latest
    ports:
      - "9009:9000"     # API
      - "9001:9001"     # Web UI
    environment:
      MINIO_ROOT_USER: adminadmin
      MINIO_ROOT_PASSWORD: adminadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - traefik

volumes:
  postgres_data:
  nats_data:
  minio_data:
  redis_data:
  authentik_media:
  authentik_templates:
  authentik_certs:

networks:
  traefik:
    name: infra_traefik
    driver: overlay
    attachable: true
