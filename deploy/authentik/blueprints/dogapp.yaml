version: 1
metadata:
  name: DogApp Configuration
  labels:
    blueprints.goauthentik.io/instantiate: "true"

context:
  provider_authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
  provider_invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

entries:
  # OAuth2 Provider
  - model: authentik_providers_oauth2.oauth2provider
    id: dogapp-provider
    identifiers:
      name: dogapp-provider
    attrs:
      name: dogapp-provider
      authorization_flow: !Context provider_authorization_flow
      invalidation_flow: !Context provider_invalidation_flow
      client_type: public
      client_id: dogapp
      redirect_uris:
        - matching_mode: strict
          url: "http://localhost:3000/callback"
        - matching_mode: strict
          url: "http://localhost:8080/callback"
      access_token_validity: hours=1
      refresh_token_validity: days=30
      include_claims_in_id_token: true
      sub_mode: user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  # Application
  - model: authentik_core.application
    id: dogapp
    identifiers:
      slug: dogapp
    attrs:
      name: DogApp
      slug: dogapp
      provider: !KeyOf dogapp-provider
      policy_engine_mode: any
